# Default values for generic-application-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: python
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "3.10"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
    type: ClusterIP
    ports:
      # - name: tcp
      #   port: 80
      #   targetport: 80
      #   targetname: tcp
      #   protocol: TCP
      #   type: ClusterIP



ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          svcport: 80
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
#   limits:
#       cpu: 100m
#       memory: 128Mi
#   requests:
#       cpu: 100m
#       memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
## an application generally has an application repository and a configuration
gitRepoApp:
    url:
    path: .
    branch: main
    exec: ## commands to execute after the git clone .. i.e pip install..
    size: 8Mi
    token:
    
gitRepoConfig:
  url: 
  path: .
  branch: main
  exec: ## commands to execute after git clone 
  size: 8Mi
  token:

staticIP:
exec: |
      if [ -x /app/start.sh ] ; then
        ## if a start.sh is found in gitRepoApp launch it
        /app/start.sh
      else
        echo "YOU SHOULD SPECIFY COMMAND LINE" ## command line to execute
      fi
