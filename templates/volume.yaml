# IOCS can use a PVC as a data volume, or mount the host filesystem

{{- if  .Values.gitRepoApp.url  }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "generic-application-chart.release" . }}-app
  labels:
    app: {{ include "generic-application-chart.release" . }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.gitRepoApp.size }}

---
{{- end }}
{{ if .Values.gitRepoConfig.url }}

kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "generic-application-chart.release" . }}-config
  labels:
    app: {{ include "generic-application-chart.release" . }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.gitRepoConfig.size }}
---
{{- end }}

